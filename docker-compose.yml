# Digital Switching System - deployment composition (proposal §11/§14).
#
# Not used for local development in this environment: Docker isn't installed
# in the dev sandbox this project was built in, so day-to-day work runs
# `npm run start:dev` / `npm run dev` directly against a Postgres instance
# pointed to by backend/.env's DATABASE_URL. This file is for staging/
# production once Docker is available.
#
# `postgres` here is an optional local database for self-contained/offline
# deployment - point DATABASE_URL at a managed Postgres (e.g. Neon) instead
# and drop this service if you prefer that.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-switching}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-switching_system}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
